kind = "video"
previewPath = "/memoirs-video/"
title = "Memoirs — Brand Video"
version = "1.0.0"
id = "artifacts/memoirs-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/memoirs-video/" ]
localPort = 23569

[services.development]
run = "pnpm --filter @workspace/memoirs-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/memoirs-video", "run", "build" ]
publicDir = "artifacts/memoirs-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23569"
BASE_PATH = "/memoirs-video/"
