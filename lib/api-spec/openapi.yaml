openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Memoirs API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: memoirs
    description: Memoir stories
  - name: contributors
    description: Story contributors/subjects
  - name: categories
    description: Story categories
  - name: newsletter
    description: Newsletter subscriptions
  - name: memoir-requests
    description: Memoir service requests
  - name: store
    description: Legacy gift store
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /memoirs:
    get:
      operationId: listMemoirs
      tags: [memoirs]
      summary: List all memoirs
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of memoirs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memoir"
    post:
      operationId: createMemoir
      tags: [memoirs]
      summary: Create a new memoir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoirInput"
      responses:
        "201":
          description: Created memoir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memoir"

  /memoirs/featured:
    get:
      operationId: getFeaturedMemoirs
      tags: [memoirs]
      summary: Get featured memoirs
      responses:
        "200":
          description: Featured memoirs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memoir"

  /memoirs/recent:
    get:
      operationId: getRecentMemoirs
      tags: [memoirs]
      summary: Get recently added memoirs
      responses:
        "200":
          description: Recent memoirs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memoir"

  /memoirs/stats:
    get:
      operationId: getMemoirStats
      tags: [memoirs]
      summary: Get platform statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoirStats"

  /memoirs/{id}:
    get:
      operationId: getMemoir
      tags: [memoirs]
      summary: Get a memoir by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Memoir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memoir"
        "404":
          description: Not found
    patch:
      operationId: updateMemoir
      tags: [memoirs]
      summary: Update a memoir
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoirUpdate"
      responses:
        "200":
          description: Updated memoir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memoir"
    delete:
      operationId: deleteMemoir
      tags: [memoirs]
      summary: Delete a memoir
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contributors:
    get:
      operationId: listContributors
      tags: [contributors]
      summary: List contributors
      responses:
        "200":
          description: List of contributors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contributor"
    post:
      operationId: createContributor
      tags: [contributors]
      summary: Create a contributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributorInput"
      responses:
        "201":
          description: Created contributor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contributor"

  /contributors/{id}:
    get:
      operationId: getContributor
      tags: [contributors]
      summary: Get a contributor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contributor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contributor"
        "404":
          description: Not found

  /store/products:
    get:
      operationId: listStoreProducts
      tags: [store]
      summary: List all store products
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreProduct"

  /store/products/{slug}:
    get:
      operationId: getStoreProduct
      tags: [store]
      summary: Get a product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
        "404":
          description: Not found

  /store/orders:
    post:
      operationId: createStoreOrder
      tags: [store]
      summary: Place an order for a store product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderResponse"
        "400":
          description: Invalid input

  /memoir-requests:
    post:
      operationId: createMemoirRequest
      tags: [memoir-requests]
      summary: Submit a Memoir service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoirRequestInput"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoirRequestResponse"
        "400":
          description: Invalid input

  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeInput"
      responses:
        "200":
          description: Already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscribeResponse"
        "201":
          description: Subscribed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscribeResponse"
        "400":
          description: Invalid input

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Memoir:
      type: object
      required: [id, title, excerpt, fullStory, subjectName, subjectAge, category, featured, imageUrl, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        excerpt:
          type: string
        fullStory:
          type: string
        subjectName:
          type: string
        subjectAge:
          type: ["integer", "null"]
        subjectTitle:
          type: ["string", "null"]
        category:
          type: string
        featured:
          type: boolean
        imageUrl:
          type: ["string", "null"]
        contributorId:
          type: ["integer", "null"]
        readTimeMinutes:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    MemoirInput:
      type: object
      required: [title, excerpt, fullStory, subjectName, category]
      properties:
        title:
          type: string
          minLength: 1
        excerpt:
          type: string
          minLength: 1
        fullStory:
          type: string
          minLength: 1
        subjectName:
          type: string
        subjectAge:
          type: ["integer", "null"]
        subjectTitle:
          type: ["string", "null"]
        category:
          type: string
        featured:
          type: boolean
        imageUrl:
          type: ["string", "null"]
        contributorId:
          type: ["integer", "null"]

    MemoirUpdate:
      type: object
      properties:
        title:
          type: string
        excerpt:
          type: string
        fullStory:
          type: string
        subjectName:
          type: string
        subjectAge:
          type: ["integer", "null"]
        subjectTitle:
          type: ["string", "null"]
        category:
          type: string
        featured:
          type: boolean
        imageUrl:
          type: ["string", "null"]

    MemoirStats:
      type: object
      required: [totalMemoirs, totalContributors, totalCategories, featuredCount]
      properties:
        totalMemoirs:
          type: integer
        totalContributors:
          type: integer
        totalCategories:
          type: integer
        featuredCount:
          type: integer
        recentCount:
          type: integer

    Contributor:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        memoirCount:
          type: integer
        createdAt:
          type: string

    ContributorInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]

    Category:
      type: object
      required: [id, name, slug, description, memoirCount]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        memoirCount:
          type: integer

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    StoreProduct:
      type: object
      required: [id, name, slug, tagline, description, priceKobo, category, inStock, featured]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        tagline:
          type: string
        description:
          type: string
        priceKobo:
          type: integer
        category:
          type: string
        inStock:
          type: boolean
        featured:
          type: boolean

    StoreOrderInput:
      type: object
      required: [productId, productName, quantity, customerName, customerEmail, deliveryAddress]
      properties:
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        customerName:
          type: string
          minLength: 1
        customerEmail:
          type: string
          minLength: 1
        customerPhone:
          type: ["string", "null"]
        deliveryAddress:
          type: string
          minLength: 1
        notes:
          type: ["string", "null"]

    StoreOrderResponse:
      type: object
      required: [id, message]
      properties:
        id:
          type: integer
        message:
          type: string

    MemoirRequestInput:
      type: object
      required: [subjectName, relationship, storyNotes, package, requesterName, requesterEmail]
      properties:
        subjectName:
          type: string
          minLength: 1
        subjectAge:
          type: ["integer", "null"]
        milestone:
          type: ["string", "null"]
        relationship:
          type: string
          minLength: 1
        storyNotes:
          type: string
          minLength: 1
        package:
          type: string
          enum: [essential, standard, premium]
        requesterName:
          type: string
          minLength: 1
        requesterEmail:
          type: string
          minLength: 1
        requesterPhone:
          type: ["string", "null"]

    MemoirRequestResponse:
      type: object
      required: [id, message]
      properties:
        id:
          type: integer
        message:
          type: string

    NewsletterSubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
        name:
          type: ["string", "null"]

    NewsletterSubscribeResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
